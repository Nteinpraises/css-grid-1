<!DOCTYPE html>
<html>
<head>
	<title>mozaic grids</title>
	<style>
		body{
			color: rgb(227, 227, 239);
			text-align: center;
		}
		#content{
			display: grid;
			grid-template-columns: repeat(6, 1fr);
			grid-auto-rows: minmax(120px auto); 
			max-width: 960px;
			grid-gap: 10px;
			margin: 0 auto;
		}
		#content>*{
			background: rgb(120, 120, 121);
			padding: 30px;
		}
		header{
			grid-column:1/3;
			grid-row: 1/40;
		}
		main{
			grid-column: 3/7;
			grid-row: 1/20;
		}
		aside{
			grid-column: 3/5;
			grid-row: 20/40;
		}
		nav{
			grid-column: 5/7;
			grid-row: 20/60;
		}
		footer{
			grid-column: 1/5;
			grid-row: 40/60;
		}

		#content{
			transform: scale(2);
		}


		#content{
			transform-origin: 10px 10px;
			top: -400px;
         animation: drop 0.7s ease forwards,
                      swing 3s 1.5s ease forwards
        }

        @keyframes drop{ 			
			70%{transform: translateY(700px);}
			0%{opacity: 0;}      
			100%{transform: translateY(650px); opacity: 1;}
         }         
		 @keyframes swing{ 			
			30%{transform: translateY(650px) rotateZ(90deg);}
 			0%{transform: translateY(650px) rotateZ(0deg);}
 			90%{transform: translateY(650px) rotateZ(75deg);} 
			60%{transform: translateY(650px) rotateZ(65deg);}
          	100%{transform: translateY(650px) rotateZ(70deg);} 
		}


	</style>
</head>
<body>

	<div id="content">

		<header>Header</header>		
		<main>Main</main>
		<aside>Aside</aside>
		<nav>Nav</nav>
		<footer>Footer</footer>

	</div>

</body>
